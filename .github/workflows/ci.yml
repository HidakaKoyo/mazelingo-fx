name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies # postinstall runs `wxt prepare`
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run fmt -- --check

      - name: Unit tests
        run: npm run test

      - name: Build extension
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: xvfb-run --auto-servernum -- npm run test:e2e
