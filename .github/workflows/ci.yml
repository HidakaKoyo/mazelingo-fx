name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run fmt -- --check
      - name: Unit tests
        run: npm run test

  firefox-package:
    name: Firefox package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Firefox extension
        run: npm run build:firefox
      - name: Verify Firefox manifest
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { verifyFirefoxManifest } from "./scripts/verify-manifests.mjs"; verifyFirefoxManifest(JSON.parse(await readFile(".output/firefox-mv3/manifest.json", "utf8")));'
      - name: Lint Firefox extension
        run: npm run lint:firefox
      - name: Upload Firefox package diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: firefox-package-diagnostics
          path: .output/firefox-mv3/
          if-no-files-found: ignore
          retention-days: 14

  chromium-compat:
    name: Chromium compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Chromium extension
        run: npm run build:chrome
      - name: Verify Chromium manifest
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { verifyChromeManifest } from "./scripts/verify-manifests.mjs"; verifyChromeManifest(JSON.parse(await readFile(".output/chrome-mv3/manifest.json", "utf8")));'
      - name: Upload Chromium compatibility diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: chromium-compat-diagnostics
          path: .output/chrome-mv3/
          if-no-files-found: ignore
          retention-days: 14
