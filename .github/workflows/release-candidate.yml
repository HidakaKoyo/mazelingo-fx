name: Firefox release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned Firefox candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run fmt -- --check
      - name: Unit tests
        run: npm run test
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; const version = process.env.RELEASE_VERSION; if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version ?? "")) throw new Error("version must be a semantic version"); if (packageJson.version !== version) throw new Error(`package.json version ${packageJson.version} does not match requested version ${version}`);'
      - name: Build Firefox extension
        run: npm run build:firefox
      - name: Verify Firefox manifest
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { verifyFirefoxManifest } from "./scripts/verify-manifests.mjs"; verifyFirefoxManifest(JSON.parse(await readFile(".output/firefox-mv3/manifest.json", "utf8")));'
      - name: Verify Firefox manifest version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const manifest = JSON.parse(await readFile(".output/firefox-mv3/manifest.json", "utf8")); if (manifest.version !== process.env.RELEASE_VERSION) throw new Error(`Firefox manifest version ${manifest.version} does not match requested version ${process.env.RELEASE_VERSION}`);'
      - name: Lint Firefox extension
        run: npm run lint:firefox
      - name: Create unsigned Firefox package
        run: npm run zip:firefox
      - name: Upload unsigned Firefox release candidate
        uses: actions/upload-artifact@v6
        with:
          name: firefox-unsigned-${{ inputs.version }}
          path: |
            .output/mazelingo-fx-${{ inputs.version }}-firefox.zip
            .output/firefox-mv3/manifest.json
          if-no-files-found: error
          retention-days: 14
