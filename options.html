<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mazelingo 設定</title>
    <style>
      :root {
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f9fafb;
        color: #1f2937;
        font-family: "Trebuchet MS", "Verdana", sans-serif;
      }
      .page {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px 40px;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #f3f4f6;
        border-radius: 20px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid #f3f4f6;
      }
      .panel-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
      }
      .panel-subtitle {
        font-size: 12px;
        color: #9ca3af;
        margin: 4px 0 0;
      }
      .lang-toggle {
        display: inline-flex;
        gap: 4px;
        background: #f3f4f6;
        padding: 3px;
        border-radius: 999px;
      }
      .lang-pill {
        border: 0;
        background: transparent;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        border-radius: 999px;
      }
      .lang-pill.is-active {
        background: #ffffff;
        color: #1f2937;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      }
      .panel-body {
        padding: 20px;
      }
      .section {
        margin-bottom: 18px;
      }
      .section:last-child {
        margin-bottom: 0;
      }
      .label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #374151;
      }
      .input,
      .select {
        width: 100%;
        border: 2px solid #e5e7eb;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 13px;
        background: #f9fafb;
        color: #111827;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .input:focus,
      .select:focus {
        border-color: #34d399;
      }
      .toggle-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .toggle-card {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 16px;
        border-radius: 18px;
        border: 2px solid #e5e7eb;
        background: #ffffff;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .toggle-input:checked + .toggle-card {
        border-color: #34d399;
        background: #ecfdf5;
      }
      .toggle-icon {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e5e7eb;
        color: #9ca3af;
        transition: all 0.2s ease;
      }
      .toggle-input:checked + .toggle-card .toggle-icon {
        background: #22c55e;
        color: #ffffff;
      }
      .toggle-title {
        font-size: 14px;
        font-weight: 700;
        color: #111827;
      }
      .toggle-desc {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
      }
      .model-chain {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .model-chain-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .model-chain-badge {
        font-size: 11px;
        font-weight: 700;
        color: #6b7280;
        min-width: 28px;
        text-align: center;
      }
      .model-chain-row .select {
        flex: 1;
      }
      .model-chain-control {
        flex: 1;
        min-width: 0;
      }
      .model-chain-control .select {
        width: 100%;
      }
      .custom-model-input {
        margin-top: 8px;
      }
      .custom-model-input[hidden] {
        display: none;
      }
      .checkbox-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 8px 0;
      }
      .checkbox-input {
        width: 18px;
        height: 18px;
        accent-color: #22c55e;
        cursor: pointer;
        flex-shrink: 0;
      }
      .checkbox-label {
        font-size: 13px;
        font-weight: 700;
        color: #374151;
      }
      .checkbox-desc {
        font-size: 12px;
        color: #9ca3af;
      }
      .ratio-card {
        background: #f9fafb;
        border-radius: 18px;
        padding: 16px;
      }
      .ratio-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .ratio-label {
        font-size: 13px;
        font-weight: 700;
        color: #374151;
      }
      .ratio-track {
        position: relative;
        width: 100%;
        height: 10px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
      }
      .ratio-slider {
        position: relative;
        height: 24px;
      }
      .ratio-slider .ratio-track {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
      }
      .ratio-slider input[type="range"] {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }
      .ratio-slider input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        background: transparent;
      }
      .ratio-slider input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 0;
        height: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
      }
      .ratio-slider input[type="range"]::-moz-range-track {
        height: 10px;
        background: transparent;
      }
      .ratio-slider input[type="range"]::-moz-range-thumb {
        width: 0;
        height: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
      }
      .ratio-fill {
        position: absolute;
        inset: 0;
        width: 50%;
        background: linear-gradient(90deg, #34d399, #22c55e);
        border-radius: 999px;
        transition: width 0.2s ease;
      }
      .ratio-meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 8px;
      }
      .ratio-meta span {
        font-weight: 700;
      }
      .ratio-meta .en {
        color: #16a34a;
      }
      .ratio-meta .ja {
        color: #6b7280;
      }
      .ratio-card input[type="range"] {
        width: 100%;
      }
      .page-list-card {
        background: #f9fafb;
        border-radius: 18px;
        padding: 16px;
      }
      .page-mode {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .page-mode-button {
        border: 2px solid #e5e7eb;
        background: #ffffff;
        border-radius: 14px;
        padding: 12px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .page-mode-button.is-active {
        border-color: #34d399;
        background: #ecfdf5;
        color: #15803d;
      }
      .page-mode-button .page-mode-desc {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 500;
        color: #9ca3af;
      }
      .page-mode-button.is-active .page-mode-desc {
        color: #16a34a;
      }
      .page-list-textarea {
        width: 100%;
        border: 2px solid #e5e7eb;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 12px;
        background: #ffffff;
        color: #111827;
        font-family: "Consolas", "Courier New", monospace;
        resize: none;
        min-height: 96px;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .page-list-textarea:focus {
        border-color: #34d399;
      }
      .save-button {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 728px;
        padding: 14px;
        border: 0;
        border-radius: 18px;
        background: #22c55e;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 18px rgba(34, 197, 94, 0.18);
        transition: background 0.2s ease;
        z-index: 100;
      }
      .save-button.is-shaking {
        animation: bounceShake 0.7s ease-in-out;
      }
      .save-button:hover {
        background: #16a34a;
      }
      @keyframes bounceShake {
        0%, 100% { transform: translateY(0) translateX(0); }
        10% { transform: translateY(-8px) translateX(-5px); }
        20% { transform: translateY(0) translateX(5px); }
        30% { transform: translateY(-6px) translateX(-5px); }
        40% { transform: translateY(0) translateX(5px); }
        50% { transform: translateY(-4px) translateX(-3px); }
        60% { transform: translateY(0) translateX(3px); }
        70% { transform: translateY(-2px) translateX(-2px); }
        80% { transform: translateY(0) translateX(2px); }
        90% { transform: translateY(-1px) translateX(0); }
      }
      .save-footer {
        height: 60px;
      }
      .status {
        position: fixed;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 728px;
        font-size: 12px;
        color: #16a34a;
        min-height: 16px;
        text-align: center;
        background: #ffffff;
        padding: 4px 0;
        z-index: 100;
      }
      .api-key-row {
        margin-bottom: 10px;
      }
      .api-key-row:last-child {
        margin-bottom: 0;
      }
      .api-key-row label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #6b7280;
        margin-bottom: 6px;
      }
      .api-key-row .api-key-wrap {
        position: relative;
      }
      .api-key-row .input {
        padding-right: 44px;
      }
      .api-key-row .api-key-toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .api-key-row .api-key-toggle:hover {
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <div class="panel-header">
          <div>
            <p class="panel-title" id="panelTitle">Mazelingo 設定</p>
            <p class="panel-subtitle" id="panelSubtitle">Duolingo風の丸みデザイン</p>
          </div>
          <div class="lang-toggle">
            <button class="lang-pill is-active" id="langJa" type="button">日本語</button>
            <button class="lang-pill" id="langEn" type="button">EN</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="section">
            <label class="toggle-wrap">
              <input type="checkbox" id="enabled" class="toggle-input" />
              <div class="toggle-card">
                <div class="toggle-icon" aria-hidden="true">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M5 13l4 4L19 7"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div>
                  <div class="toggle-title" id="enableTitle">翻訳を有効にする</div>
                  <div class="toggle-desc" id="enableDesc">自動翻訳機能をオンにします</div>
                </div>
              </div>
            </label>
          </div>

          <div class="section">
            <label class="toggle-wrap">
              <input type="checkbox" id="mixLanguage" class="toggle-input" />
              <div class="toggle-card">
                <div class="toggle-icon" aria-hidden="true">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div>
                  <div class="toggle-title" id="mixLanguageTitle">言語をミックス</div>
                  <div class="toggle-desc" id="mixLanguageDesc">
                    文ごとにランダムに言語を混ぜる
                  </div>
                </div>
              </div>
            </label>
          </div>

          <div class="section ratio-card">
            <div class="ratio-header">
              <span class="ratio-label" id="ratioTitle">言語の割合</span>
            </div>
            <div class="ratio-slider">
              <div class="ratio-track">
                <div id="ratioFill" class="ratio-fill"></div>
              </div>
              <input type="range" id="englishRatio" min="0" max="100" step="10" />
            </div>
            <div class="ratio-meta">
              <span class="en"><span id="ratioEnLabel">英語</span> <span id="ratioEnValue">50%</span></span>
              <span class="ja"><span id="ratioJaLabel">日本語</span> <span id="ratioJaValue">50%</span></span>
            </div>
          </div>

          <div class="section">
            <label class="checkbox-wrap">
              <input type="checkbox" id="translateButtons" class="checkbox-input" />
              <span class="checkbox-label" id="translateButtonsTitle">ボタンを翻訳</span>
              <span class="checkbox-desc" id="translateButtonsDesc">ボタン内のテキストも翻訳する</span>
            </label>
          </div>

          <div class="section">
            <label class="label" id="minTextLengthLabel" for="minTextLength">最小文字数</label>
            <input type="number" id="minTextLength" class="input" min="1" max="100" placeholder="2" />
            <div style="font-size: 11px; color: #9ca3af; margin-top: 6px;" id="minTextLengthHint">この文字数未満のテキストは翻訳しない</div>
          </div>

          <div class="section page-list-card">
            <span class="label" id="pageListLabel">ページリスト</span>
            <div class="page-mode">
              <button class="page-mode-button" id="pageModeOptIn" type="button" aria-pressed="false">
                <span class="page-mode-title" id="pageModeOptInTitle">オプトイン</span>
                <span class="page-mode-desc" id="pageModeOptInDesc">指定したページのみ翻訳</span>
              </button>
              <button class="page-mode-button" id="pageModeOptOut" type="button" aria-pressed="true">
                <span class="page-mode-title" id="pageModeOptOutTitle">オプトアウト</span>
                <span class="page-mode-desc" id="pageModeOptOutDesc">指定したページを除外</span>
              </button>
            </div>
            <textarea
              id="pageListOptIn"
              class="page-list-textarea"
              style="display: none;"
              placeholder="URLを1行ずつ入力&#10;例: https://example.com/*"
            ></textarea>
            <textarea
              id="pageListOptOut"
              class="page-list-textarea"
              placeholder="URLを1行ずつ入力&#10;例: https://example.com/*"
            ></textarea>
          </div>

          <div class="section">
            <label class="label" id="modelsLabel">モデルチェーン</label>
            <div style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;" id="modelsHint">優先順にフォールバック（空欄はスキップ）</div>
            <div class="model-chain">
              <div class="model-chain-row">
                <span class="model-chain-badge">1st</span>
                <div class="model-chain-control">
                  <select id="model0" class="select"></select>
                  <input id="customModel0" class="input custom-model-input" type="text" hidden />
                </div>
              </div>
              <div class="model-chain-row">
                <span class="model-chain-badge">2nd</span>
                <div class="model-chain-control">
                  <select id="model1" class="select"></select>
                  <input id="customModel1" class="input custom-model-input" type="text" hidden />
                </div>
              </div>
              <div class="model-chain-row">
                <span class="model-chain-badge">3rd</span>
                <div class="model-chain-control">
                  <select id="model2" class="select"></select>
                  <input id="customModel2" class="input custom-model-input" type="text" hidden />
                </div>
              </div>
            </div>
          </div>

          <div class="section" id="apiKeysSection">
          </div>

          <div class="save-footer"></div>
        </div>
        <div class="status" id="status"></div>
        <button id="save" class="save-button">保存</button>
      </div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
